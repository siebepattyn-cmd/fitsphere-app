<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>FitSphere — Progressive Training</title>
<meta name="description" content="A fully personalized strength, calisthenics and skill-progression trainer with built-in progressive overload.">
<meta name="theme-color" content="#16151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitSphere">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
/* ============================================================
   OVERLOAD — design tokens & styles
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1, "lnum" 1;
  overscroll-behavior-y: none;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

:root{
  --bg: #16151b;
  --bg-raised: #1c1b23;
  --surface: #211f28;
  --surface-2: #29272f;
  --border: #34323c;
  --border-soft: #2a2830;
  --ink: #f1efe9;
  --ink-dim: #a8a5b0;
  --ink-mute: #726f7a;
  --steel: #6f9bd1;
  --copper: #c17a45;
  --sage: #7fa876;
  --danger: #c15b56;
  --accent: var(--steel);
  --radius-card: 14px;
  --radius-chip: 7px;
  --radius-pill: 999px;
}
body[data-accent="copper"]{ --accent: var(--copper); }
body[data-accent="sage"]{ --accent: var(--sage); }

#app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

.ic { display: inline-flex; width: 1em; height: 1em; vertical-align: -0.14em; }
.ic svg { width: 100%; height: 100%; }

/* ---------- App shell ---------- */
.shell { display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 10px; position: sticky; top: 0; background: var(--bg); z-index: 5;
}
.brand { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.streak-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border-soft);
  padding: 6px 12px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 700;
  color: var(--copper);
}
.streak-chip .ic { font-size: 15px; }
.main { flex: 1; padding: 6px 20px 28px; }

.bottomnav {
  position: sticky; bottom: 0; display: flex; background: var(--bg-raised);
  border-top: 1px solid var(--border-soft); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: var(--ink-mute); font-size: 11px; font-weight: 600;
  padding: 8px 4px; border-radius: 10px; cursor: pointer; font-family: inherit;
}
.nav-item .ic { font-size: 21px; }
.nav-item.nav-active { color: var(--ink); }
.nav-item.nav-active .ic { color: var(--accent); }

/* ---------- Buttons ---------- */
button { font-family: inherit; }
.btn-primary {
  background: var(--accent); color: #14131a; border: none; font-weight: 700; font-size: 15px;
  padding: 14px 22px; border-radius: var(--radius-pill); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.12s ease, opacity 0.12s ease;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-secondary {
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  font-weight: 600; font-size: 14px; padding: 12px 18px; border-radius: var(--radius-pill);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; margin-top: 8px;
}
.btn-ghost {
  background: none; border: none; color: var(--ink-dim); font-weight: 600; font-size: 14px;
  padding: 10px 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
}
.btn-danger {
  background: none; color: var(--danger); border: 1px solid rgba(193,91,86,0.35);
  font-weight: 600; font-size: 14px; padding: 12px 18px; border-radius: var(--radius-pill);
  cursor: pointer; width: 100%; margin-top: 10px;
}
.icon-btn {
  background: var(--surface); border: 1px solid var(--border-soft); color: var(--ink);
  width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center;
  justify-content: center; cursor: pointer;
}
.icon-btn-spacer { width: 36px; }

/* ---------- Onboarding wizard ---------- */
.wiz { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; }
.wiz-progress { height: 3px; background: var(--surface); }
.wiz-progress-fill { height: 100%; background: var(--accent); transition: width 0.25s ease; }
.wiz-body { flex: 1; padding: 28px 22px 20px; }
.wiz-step-count { color: var(--ink-mute); font-size: 12.5px; font-weight: 600; margin: 0 0 10px; }
.wiz-h1 { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 8px; }
.wiz-sub { color: var(--ink-dim); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
.wiz-badge {
  width: 46px; height: 46px; border-radius: 50%; background: var(--surface);
  display: flex; align-items: center; justify-content: center; color: var(--accent);
  font-size: 22px; margin-bottom: 16px;
}
.wiz-nav {
  display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 26px;
}

.opt-list { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--surface); border: 1px solid var(--border-soft); color: var(--ink);
  padding: 14px 16px; border-radius: var(--radius-card); cursor: pointer; font-family: inherit;
}
.opt-active { border-color: var(--accent); background: var(--surface-2); }
.opt-check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--bg);
}
.opt-active .opt-check { background: var(--accent); border-color: var(--accent); }
.opt-text { display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
.opt-text b { font-weight: 600; }
.opt-text small { color: var(--ink-dim); font-size: 12.5px; font-weight: 400; }

.review-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: 4px 16px; margin: 4px 0 16px; }
.review-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
.review-row:last-child { border-bottom: none; }
.review-row span { color: var(--ink-dim); }
.review-row b { font-weight: 600; text-align: right; }

/* ---------- Home ---------- */
.hero-card {
  background: linear-gradient(160deg, var(--surface-2), var(--surface));
  border: 1px solid var(--border-soft); border-radius: var(--radius-card);
  padding: 22px 20px; margin: 10px 0 16px;
}
.hero-eyebrow { color: var(--accent); font-size: 12.5px; font-weight: 700; margin: 0 0 6px; }
.hero-title { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
.hero-meta { color: var(--ink-dim); font-size: 13px; margin: 0 0 14px; }
.hero-list { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hero-list li { font-size: 14px; color: var(--ink); padding-left: 14px; position: relative; }
.hero-list li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.hero-more { color: var(--ink-mute) !important; font-size: 13px !important; }
.hero-more::before { display: none; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: 14px 10px; text-align: center; }
.stat-num { display: block; font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
.stat-label { display: block; font-size: 11px; color: var(--ink-dim); margin-top: 3px; line-height: 1.3; }

.week-strip { display: flex; justify-content: space-between; margin: 6px 0 18px; padding: 0 4px; }
.week-dot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.week-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); display: block; }
.week-dot-filled i { background: var(--accent); border-color: var(--accent); }
.week-dot span { font-size: 10.5px; color: var(--ink-mute); font-weight: 600; }
.week-dot-today span { color: var(--ink); }

.quote { color: var(--ink-dim); font-size: 13.5px; font-style: normal; text-align: center; margin: 4px 20px 22px; line-height: 1.5; }

.section-label { font-size: 13px; font-weight: 700; color: var(--ink); margin: 0 0 10px; }
.day-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.day-pill { background: var(--surface); border: 1px solid var(--border-soft); color: var(--ink-dim); font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: var(--radius-pill); }
.day-pill-active { background: var(--surface-2); border-color: var(--accent); color: var(--ink); }

/* ---------- Views (skills / progress / settings) ---------- */
.view-pad { padding-top: 8px; }
.view-title { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
.view-sub { color: var(--ink-dim); font-size: 13.5px; line-height: 1.5; margin: 0 0 18px; }
.empty-note { color: var(--ink-mute); font-size: 13.5px; text-align: center; padding: 30px 10px; }

.skill-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: 16px; margin-bottom: 12px; }
.skill-card h3 { font-size: 15.5px; font-weight: 700; margin: 0 0 12px; }
.skill-steps { display: flex; flex-direction: column; gap: 2px; }
.skill-step { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13.5px; color: var(--ink-mute); border-left: 2px solid var(--border-soft); padding-left: 12px; margin-left: 10px; }
.skill-step:last-child { border-left-color: transparent; }
.step-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--bg-raised); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 700;
  margin-left: -22px; color: var(--ink-dim);
}
.step-done .step-num { background: var(--accent); border-color: var(--accent); color: #14131a; }
.step-done .step-name { color: var(--ink-dim); text-decoration: line-through; text-decoration-color: var(--border); }
.step-current { color: var(--ink); }
.step-current .step-num { border-color: var(--accent); color: var(--accent); }
.step-name { flex: 1; }
.step-target { color: var(--ink-mute); font-size: 12px; font-weight: 600; }

.chart-wrap { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: 14px 10px; margin-bottom: 18px; height: 200px; }
.select {
  width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--border-soft);
  border-radius: var(--radius-chip); padding: 11px 12px; font-size: 14px; margin-bottom: 12px; font-family: inherit;
}

.settings-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: 16px; margin-bottom: 14px; }
.segmented { display: flex; background: var(--bg-raised); border-radius: var(--radius-pill); padding: 3px; border: 1px solid var(--border-soft); }
.seg { flex: 1; background: none; border: none; color: var(--ink-dim); font-weight: 600; font-size: 13.5px; padding: 9px 0; border-radius: var(--radius-pill); cursor: pointer; font-family: inherit; }
.seg-active { background: var(--surface-2); color: var(--ink); }
.swatch-row { display: flex; gap: 12px; }
.swatch { width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch-steel { background: var(--steel); }
.swatch-copper { background: var(--copper); }
.swatch-sage { background: var(--sage); }
.swatch-active { border-color: var(--ink); }
.privacy-note { display: flex; align-items: center; gap: 8px; color: var(--ink-mute); font-size: 12.5px; justify-content: center; margin: 18px 0 6px; }

/* ---------- Session / logging ---------- */
.main-session { padding-top: 4px; }
.topbar-session { justify-content: space-between; }
.session-title { font-size: 16px; font-weight: 700; }
.mini-block { margin: 6px 0 20px; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist li { font-size: 13.5px; color: var(--ink-dim); padding-left: 16px; position: relative; }
.checklist li::before { content: ""; position: absolute; left: 0; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--border); }

.ex-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-card); padding: 16px; margin-bottom: 12px; }
.ex-card-skill { border-color: rgba(193,122,69,0.35); }
.ex-head h3 { font-size: 16px; font-weight: 700; margin: 0 0 3px; }
.ex-meta { font-size: 12.5px; color: var(--ink-mute); }
.skill-chip { display: inline-block; font-size: 11px; font-weight: 700; color: var(--copper); margin-bottom: 4px; }
.ex-suggestion { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--accent); background: var(--bg-raised); padding: 8px 10px; border-radius: var(--radius-chip); margin: 10px 0 0; }
.advance-banner { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--copper); background: rgba(193,122,69,0.12); padding: 10px 12px; border-radius: var(--radius-chip); margin: 10px 0 0; flex-wrap: wrap; }
.btn-advance { background: var(--copper); color: #14131a; border: none; font-weight: 700; font-size: 12px; padding: 6px 12px; border-radius: var(--radius-pill); cursor: pointer; margin-left: auto; }

.set-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.set-row { display: flex; align-items: center; gap: 8px; }
.set-num { width: 20px; font-size: 12px; font-weight: 700; color: var(--ink-mute); text-align: center; flex-shrink: 0; }
.num-in {
  flex: 1; min-width: 0; background: var(--bg-raised); border: 1px solid var(--border); color: var(--ink);
  border-radius: var(--radius-chip); padding: 9px 8px; font-size: 14px; font-weight: 700; text-align: center;
  font-family: inherit; -moz-appearance: textfield;
}
.num-in::-webkit-outer-spin-button, .num-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num-in-sm { flex: 1; }
.unit { font-size: 10.5px; color: var(--ink-mute); font-weight: 600; width: 26px; flex-shrink: 0; }
.set-check {
  width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border); background: none;
  color: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}
.set-done .set-check { background: var(--sage); border-color: var(--sage); }
.set-done .num-in { opacity: 0.55; }

.btn-rest {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 12px;
  background: var(--bg-raised); border: 1px solid var(--border-soft); color: var(--ink-dim);
  font-weight: 600; font-size: 13px; padding: 10px; border-radius: var(--radius-pill); cursor: pointer; font-family: inherit;
}
.btn-finish {
  margin-top: 8px; animation: none;
}
.btn-finish:active { animation: finish-pulse 0.35s ease; }
@keyframes finish-pulse { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }

.timer-bar {
  position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px;
  background: var(--bg-raised); border-top: 1px solid var(--border-soft);
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
}
.timer-ring { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
.timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-bg { fill: none; stroke: var(--surface-2); stroke-width: 3; }
.timer-fg { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.timer-ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.timer-label { flex: 1; font-size: 13.5px; font-weight: 600; color: var(--ink-dim); }

/* focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <div class="wiz"><div class="wiz-body" style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#726f7a;font-size:14px;">Loading FitSphere…</div></div>
</div>

/* ---------- Wizard flow ---------- */
function wizardSteps(a){
  const steps = ['location'];
  if(a.location === 'gym' || a.location === 'both') steps.push('gymStyle');
  if(a.gymStyle === 'cali' || a.gymStyle === 'combo') steps.push('gymMachines');
  if(a.location === 'home' || a.location === 'both') steps.push('equipment');
  steps.push('goal', 'experience', 'days', 'duration');
  const wantsSkills = a.goal === 'skills' || a.gymStyle === 'cali' || a.gymStyle === 'combo' || (a.equipment && a.equipment.includes('bar'));
  if(wantsSkills) steps.push('skillGoals');
  steps.push('limitations', 'units', 'review');
  return steps;
}

function effectiveEquipment(a){
  const gymSet = a.gymStyle === 'weight' ? ['bb','db','machine','bench','bar']
    : a.gymStyle === 'cali' ? (a.gymMachines ? ['bw','bar','rings','para','dip','machine'] : ['bw','bar','rings','para','dip'])
    : ['bw','bar','rings','para','dip','bb','db','machine','bench']; // combo
  if(a.location === 'gym') return gymSet;
  if(a.location === 'home') return (a.equipment && a.equipment.length) ? a.equipment : ['bw'];
  return Array.from(new Set([...(a.equipment || ['bw']), ...gymSet]));
}

function splitFor(days){
  if(days <= 2) return SPLITS[2];
  if(days === 3) return SPLITS[3];
  if(days === 4) return SPLITS[4];
  if(days === 5) return SPLITS[5];
  return SPLITS[6];
}

const GOAL_SCHEME = {
  muscle:   {sets:4, rest:75,  bias:0.45, label:'Hypertrophy'},
  strength: {sets:5, rest:150, bias:0.15, label:'Strength'},
  skills:   {sets:4, rest:120, bias:0.30, label:'Skill'},
  fatloss:  {sets:3, rest:40,  bias:0.80, label:'Conditioning'},
  general:  {sets:3, rest:65,  bias:0.40, label:'General fitness'},
};
const LEVEL_NUM = {beginner:1, intermediate:2, advanced:3};

function pickCount(duration){ return Math.max(3, Math.min(8, Math.round(duration / 12))); }

// avoidTags are a hard filter and are never relaxed, even when every other
// constraint has to loosen to fill a slot. usage is a Map<exId,count> used to
// spread repeats evenly (and to offset A/B paired days) instead of always
// returning the single top match.
function selectExercise(cat, equipment, gymStyle, levelNum, avoidTags, usage, offset){
  const safe = EX.filter(e => e.cat === cat
    && e.equip.some(eq => equipment.includes(eq))
    && !e.avoid.some(a => avoidTags.includes(a)));
  if(!safe.length) return null;

  let pool = safe.filter(e => e.level <= levelNum + 1);
  if(!pool.length) pool = safe.slice();

  if(gymStyle === 'cali' || gymStyle === 'weight'){
    const styled = pool.filter(e => e.style === gymStyle || e.style === 'both');
    if(styled.length) pool = styled;
  }

  pool = pool.slice().sort((a,b) => {
    const ua = usage.get(a.id) || 0, ub = usage.get(b.id) || 0;
    if(ua !== ub) return ua - ub;
    return a.level - b.level;
  });
  const idx = Math.min(offset || 0, pool.length - 1);
  return pool[idx];
}

function prescribe(ex, goal){
  const scheme = GOAL_SCHEME[goal] || GOAL_SCHEME.general;
  const sets = ex.type === 'time' ? Math.min(3, scheme.sets) : scheme.sets;
  if(ex.type === 'reps' || ex.type === 'weight'){
    const [lo, hi] = ex.rep;
    const target = Math.round(lo + (hi - lo) * scheme.bias);
    return {sets, repLo:lo, repHi:hi, targetReps:target, targetWeight: ex.type === 'weight' ? 0 : null, rest: scheme.rest};
  }
  const [lo, hi] = ex.time;
  const target = Math.round(lo + (hi - lo) * 0.3);
  return {sets, timeLo:lo, timeHi:hi, targetTime:target, rest: scheme.rest};
}

function buildDay(dayTpl, profile, dayOffset){
  const equipment = effectiveEquipment(profile);
  const count = pickCount(profile.duration);
  const cats = dayTpl.cats;
  const levelNum = LEVEL_NUM[profile.experience] || 1;
  const gymStyle = profile.location === 'home' ? null : profile.gymStyle;
  const usage = new Map();
  const exercises = [];
  let skillSlots = 0;

  (profile.skillGoals || []).forEach(sid => {
    if(skillSlots >= 2) return;
    const skill = SKILLS[sid];
    if(!skill || !cats.includes(skill.cat)) return;
    const stepIdx = Math.min((profile.skillProgress && profile.skillProgress[sid]) || 0, skill.steps.length - 1);
    const step = skill.steps[stepIdx];
    exercises.push({kind:'skill', skillId:sid, skillName:skill.name, stepIndex:stepIdx, name:step.name, metric:step.metric, unit:step.unit, target:step.target, sets:4, rest:110});
    skillSlots++;
  });

  let i = 0, guard = 0;
  while(exercises.length < count && guard < cats.length * 4){
    const cat = cats[i % cats.length];
    const ex = selectExercise(cat, equipment, gymStyle, levelNum, profile.limitations || [], usage, dayOffset);
    if(ex){
      usage.set(ex.id, (usage.get(ex.id) || 0) + 1);
      const p = prescribe(ex, profile.goal);
      exercises.push({kind:'exercise', exId:ex.id, name:ex.name, cat:ex.cat, type:ex.type, ...p});
    } else {
      guard += cats.length; // nothing safe exists for this category at all — stop trying it
    }
    i++; guard++;
  }
  return {label: dayTpl.label, exercises};
}

function generateProgram(profile){
  const split = splitFor(profile.days).slice(0, profile.days);
  const days = split.map(tpl => buildDay(tpl, profile, /\bB\b/.test(tpl.label) ? 1 : 0));
  return {days, generatedAt: Date.now()};
}

/* ---------- Progressive overload engine ---------- */
function historyFor(logs, kind, key){
  const out = [];
  for(let i = logs.length - 1; i >= 0; i--){
    const day = logs[i];
    for(const entry of day.entries){
      if(kind === 'exercise' && entry.kind === 'exercise' && entry.exId === key) out.push(entry);
      if(kind === 'skill' && entry.kind === 'skill' && entry.skillId === key) out.push(entry);
    }
  }
  return out;
}

function suggestNext(item, history){
  if(!history.length) return null;
  const last = history[0];
  if(!last.sets || !last.sets.length) return null;
  if(item.type === 'weight'){
    const topReps = item.repHi;
    const hitTop = last.sets.every(s => (s.reps || 0) >= topReps);
    const lastWeight = last.sets[last.sets.length - 1].weight || 0;
    if(hitTop){
      const inc = (item.cat === 'legs') ? 5 : 2.5;
      return {type:'weight', weight: lastWeight + inc, reps: item.repLo, note:'Add load \u2014 you hit the top of your rep range.'};
    }
    const avgReps = Math.round(last.sets.reduce((s,x)=>s+(x.reps||0),0) / last.sets.length);
    return {type:'weight', weight: lastWeight, reps: Math.min(item.repHi, avgReps + 1), note:'Same weight, chase one more rep per set.'};
  }
  if(item.type === 'reps'){
    const avg = last.sets.reduce((s,x)=>s+(x.reps||0),0) / last.sets.length;
    if(avg >= item.repHi){
      const exDef = EX_BY_ID[item.exId];
      if(exDef && exDef.next){
        return {type:'reps', reps:item.repHi, note:'Maxed this range \u2014 try progressing to ' + EX_BY_ID[exDef.next].name + '.'};
      }
      return {type:'reps', reps:item.repHi, note:'At the top of your range \u2014 consider adding resistance.'};
    }
    return {type:'reps', reps: Math.min(item.repHi, Math.round(avg) + 1), note:'One more rep than last time.'};
  }
  if(item.type === 'time'){
    const avg = last.sets.reduce((s,x)=>s+(x.time||0),0) / last.sets.length;
    if(avg >= item.timeHi) return {type:'time', time:item.timeHi + 5, note:'Extend the hold \u2014 add 5 seconds.'};
    return {type:'time', time: Math.min(item.timeHi, Math.round(avg) + 5), note:'A few seconds longer than last time.'};
  }
  return null;
}

function suggestSkillAdvance(skillId, history){
  const skill = SKILLS[skillId];
  if(!skill || history.length < 2) return false;
  const stepIdx = history[0].stepIndex;
  const recent = history.filter(h => h.stepIndex === stepIdx).slice(0,2);
  if(recent.length < 2) return false;
  const target = skill.steps[stepIdx].target;
  return recent.every(h => h.sets && h.sets.length && h.sets.every(s => (s.value||0) >= target));
}

const capCache = {};
async function getCapability(name){
  if(name in capCache) return capCache[name];
  let ns = null;
  try {
    if(typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function'){
      ns = await window.claude.use(name);
    }
  } catch(e){ ns = null; }
  capCache[name] = ns;
  return ns;
}

function serializable(){
  const {timer, ...rest} = state;
  return rest;
}
async function persist(){
  try { localStorage.setItem('fitsphere_state_v1', JSON.stringify(serializable())); }
  catch(e){ console.warn('FitSphere: save failed', e); }
}
async function restore(){
  try {
    const raw = localStorage.getItem('fitsphere_state_v1');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function estimateMinutes(day){
  let sec = 5 * 60;
  day.exercises.forEach(e => { sec += (e.sets || 3) * (35 + (e.rest || 60)); });
  sec += 4 * 60;
  return Math.round(sec / 60);
}

function isoWeekKey(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day + 3);
  const firstThu = new Date(d.getFullYear(), 0, 4);
  const week = 1 + Math.round(((d - firstThu) / 86400000 - 3 + ((firstThu.getDay() + 6) % 7)) / 7);
  return d.getFullYear() + '-W' + week;
}
function updateStreak(date){
  const wk = isoWeekKey(date);
  const lastWk = state.lastDate ? isoWeekKey(state.lastDate) : null;
  if(lastWk === wk){ /* same week already counted */ }
  else if(lastWk === null){ state.streak = 1; }
  else {
    const prevWeekDate = new Date(date + 'T00:00:00'); prevWeekDate.setDate(prevWeekDate.getDate() - 7);
    const prevWk = isoWeekKey(prevWeekDate.toISOString().slice(0,10));
    state.streak = (lastWk === prevWk) ? state.streak + 1 : 1;
  }
  state.lastDate = date;
}

  if(state.view === 'session' && state.draft) return renderSessionView();

}

}

function buildDraftEntry(item){
  if(item.kind === 'exercise'){
    const hist = historyFor(state.logs, 'exercise', item.exId);
    const sug = suggestNext(item, hist);
    const sets = Array.from({length: item.sets}, () => ({
      reps: item.type !== 'time' ? (sug ? (sug.reps ?? item.targetReps) : item.targetReps) : null,
      weight: item.type === 'weight' ? (sug ? sug.weight : 0) : null,
      time: item.type === 'time' ? (sug ? sug.time : item.targetTime) : null,
      done: false,
    }));
    return {...item, sets, suggestion: sug};
  }
  const hist = historyFor(state.logs, 'skill', item.skillId);
  const sets = Array.from({length: item.sets}, () => ({value: item.target, done:false}));
  const readyToAdvance = suggestSkillAdvance(item.skillId, hist);
  return {...item, sets, readyToAdvance};
}

function startSession(){
  const day = state.program.days[state.activeDayIndex];
  state.draft = {dayIndex: state.activeDayIndex, entries: day.exercises.map(buildDraftEntry)};
  state.view = 'session';
}

function finishSession(){
  const draft = state.draft;
  const entries = draft.entries.map(e => {
    if(e.kind === 'skill') return {kind:'skill', skillId:e.skillId, stepIndex:e.stepIndex, sets: e.sets.map(s => ({value: Number(s.value) || 0}))};
    return {kind:'exercise', exId:e.exId, type:e.type, cat:e.cat, repHi:e.repHi, repLo:e.repLo, timeHi:e.timeHi, timeLo:e.timeLo,
      sets: e.sets.map(s => ({reps: s.reps != null ? Number(s.reps) : undefined, weight: s.weight != null ? Number(s.weight) : undefined, time: s.time != null ? Number(s.time) : undefined}))};
  });
  const date = todayISO();
  state.logs.push({date, dayIndex: draft.dayIndex, dayLabel: state.program.days[draft.dayIndex].label, entries});
  updateStreak(date);
  state.activeDayIndex = (draft.dayIndex + 1) % state.program.days.length;
  state.draft = null;
  state.view = 'home';
  persist();
}

    </svg><span id="timerText">${state.timer.remaining}</span></div>
    <span class="timer-label">${esc(state.timer.label)}</span>
    <button class="btn-ghost" data-action="skip-rest">Skip</button>
  </div>`;
}

function renderSessionView(){
  const draft = state.draft;
  const dayLabel = state.program.days[draft.dayIndex].label;
  return `<div class="shell">
    <header class="topbar topbar-session">
      <button class="icon-btn" data-action="exit-session">${icon('x')}</button>
      <span class="session-title">${esc(dayLabel)}</span>
      <span class="icon-btn-spacer"></span>
    </header>
    <main class="main main-session">
      <div class="mini-block">
        <p class="section-label">Warm-up \u2014 5 min</p>
        <ul class="checklist">${WARMUP.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
      </div>
      ${draft.entries.map((e,i) => renderEntryCard(e,i)).join('')}
      <div class="mini-block">
        <p class="section-label">Cooldown \u2014 4 min</p>
        <ul class="checklist">${COOLDOWN.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
      </div>
      <button class="btn-primary btn-block btn-finish" data-action="finish-session">Finish session ${icon('check')}</button>
    </main>
    ${renderTimerBar()}
  </div>`;
}

/* ============================================================
   SKILLS VIEW
   ============================================================ */
function renderSkillsView(){
  const hasGoals = state.profile.skillGoals && state.profile.skillGoals.length;
  const goals = hasGoals ? state.profile.skillGoals : Object.keys(SKILLS);
  return `<div class="view-pad">
    <h2 class="view-title">Skill progressions</h2>
    <p class="view-sub">${hasGoals ? 'Your selected goals \u2014 these get placed in your sessions automatically.' : 'Every progression available. Add goals in Settings to have them placed in your sessions.'}</p>
    ${goals.map(sid => renderSkillCard(sid)).join('')}
  </div>`;
}
function renderSkillCard(sid){
  const skill = SKILLS[sid];
  const stepIdx = Math.min(state.skillProgress[sid] || 0, skill.steps.length - 1);
  return `<div class="skill-card">
    <h3>${esc(skill.name)}</h3>
    <div class="skill-steps">
      ${skill.steps.map((st,i) => `<div class="skill-step ${i < stepIdx ? 'step-done' : ''} ${i === stepIdx ? 'step-current' : ''}">
        <span class="step-num">${i < stepIdx ? icon('check') : (i+1)}</span>
        <span class="step-name">${esc(st.name)}</span>
        <span class="step-target">${st.target}${esc(st.unit)}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ============================================================
   PROGRESS VIEW + CHARTS
   ============================================================ */
function renderProgressView(){
  const exOptions = Array.from(new Set(state.logs.flatMap(l => l.entries.filter(e => e.kind === 'exercise').map(e => e.exId))));
  return `<div class="view-pad">
    <h2 class="view-title">Progress</h2>
    <section class="stat-row">
      <div class="stat-card"><span class="stat-num">${state.logs.length}</span><span class="stat-label">Total sessions</span></div>
      <div class="stat-card"><span class="stat-num">${state.streak}</span><span class="stat-label">Week streak</span></div>
    </section>
    ${state.logs.length ? `<p class="section-label">Weekly volume</p>
    <div class="chart-wrap"><canvas id="volumeChart" height="180"></canvas></div>` : ''}
    ${exOptions.length ? `<p class="section-label">Exercise history</p>
    <select class="select" id="exSelect">${exOptions.map(id => `<option value="${id}">${esc(EX_BY_ID[id].name)}</option>`).join('')}</select>
    <div class="chart-wrap"><canvas id="exChart" height="180"></canvas></div>` : ''}
    ${!state.logs.length ? `<p class="empty-note">Log a session to start seeing your progress here.</p>` : ''}
  </div>`;
}

let volumeChartInst = null, exChartInst = null;
function chartBaseOptions(){
  return {responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false}, ticks:{color:'#9a97a3', font:{size:11}}}, y:{grid:{color:'#26242c'}, ticks:{color:'#9a97a3', font:{size:11}}, beginAtZero:true}}};
}
function mountCharts(){
  if(state.view !== 'progress' || typeof Chart === 'undefined') return;
  const weeks = {};
  state.logs.forEach(l => {
    const wk = isoWeekKey(l.date);
    let vol = 0;
    l.entries.forEach(e => {
      if(e.kind === 'exercise') e.sets.forEach(s => { vol += (s.reps || 0) * ((s.weight && s.weight > 0) ? s.weight : 1); });
      else e.sets.forEach(s => { vol += (s.value || 0); });
    });
    weeks[wk] = (weeks[wk] || 0) + vol;
  });
  const wkKeys = Object.keys(weeks).sort();
  const vctx = document.getElementById('volumeChart');
  if(vctx && wkKeys.length){
    if(volumeChartInst) volumeChartInst.destroy();
    volumeChartInst = new Chart(vctx, {type:'bar',
      data:{labels: wkKeys, datasets:[{data: wkKeys.map(k => Math.round(weeks[k])), backgroundColor: accentHex(), borderRadius:6, maxBarThickness:36}]},
      options: chartBaseOptions()});
  }
  const sel = document.getElementById('exSelect');
  if(sel){
    const renderExChart = (exId) => {
      const ex = EX_BY_ID[exId];
      const dates = [], vals = [];
      state.logs.forEach(l => {
        const entry = l.entries.find(e => e.kind === 'exercise' && e.exId === exId);
        if(!entry) return;
        let val;
        if(ex.type === 'weight') val = Math.max(...entry.sets.map(s => s.weight || 0));
        else if(ex.type === 'time') val = Math.max(...entry.sets.map(s => s.time || 0));
        else val = Math.max(...entry.sets.map(s => s.reps || 0));
        dates.push(fmtDate(l.date)); vals.push(val);
      });
      const ectx = document.getElementById('exChart');
      if(!ectx) return;
      if(exChartInst) exChartInst.destroy();
      exChartInst = new Chart(ectx, {type:'line',
        data:{labels: dates, datasets:[{data: vals, borderColor:'#c17a45', backgroundColor:'rgba(193,122,69,.15)', tension:.35, fill:true, pointRadius:3, pointBackgroundColor:'#c17a45'}]},
        options: chartBaseOptions()});
    };
    sel.addEventListener('change', e => renderExChart(e.target.value));
    if(sel.options.length) renderExChart(sel.value);
  }
}
function accentHex(){
  return {steel:'#6f9bd1', copper:'#c17a45', sage:'#7fa876'}[state.accent] || '#6f9bd1';
}

/* ============================================================
   SETTINGS VIEW
   ============================================================ */
function renderProfileSummary(p){
  const rows = [];
  rows.push(['Trains', LABELS.location[p.location]]);
  if(p.gymStyle) rows.push(['Style', LABELS.gymStyle[p.gymStyle]]);
  if(p.equipment && p.equipment.length) rows.push(['Home equipment', p.equipment.map(e => (EQUIPMENT_OPTIONS.find(x=>x.id===e)||{label:e}).label).join(', ')]);
  rows.push(['Goal', LABELS.goal[p.goal]]);
  rows.push(['Experience', LABELS.experience[p.experience]]);
  rows.push(['Schedule', `${p.days}x / week, ${p.duration} min`]);
  if(p.skillGoals && p.skillGoals.length) rows.push(['Skill focus', p.skillGoals.map(s => SKILL_LABELS[s]).join(', ')]);
  rows.push(['Training around', (p.limitations && p.limitations.length) ? p.limitations.map(l => LABELS.limitations[l]).join(', ') : 'Nothing flagged']);
  return `<div class="review-card">${rows.map(([k,v]) => `<div class="review-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
}
function renderSettingsView(){
  return `<div class="view-pad">
    <h2 class="view-title">Settings</h2>
    <section class="settings-card">
      <p class="section-label">Your program</p>
      ${renderProfileSummary(state.profile)}
      <button class="btn-secondary btn-block" data-action="edit-program">${icon('edit')} Edit program</button>
    </section>
    <section class="settings-card">
      <p class="section-label">Units</p>
      <div class="segmented">
        <button class="seg ${state.units==='kg'?'seg-active':''}" data-action="set-units" data-val="kg">Kilograms</button>
        <button class="seg ${state.units==='lbs'?'seg-active':''}" data-action="set-units" data-val="lbs">Pounds</button>
      </div>
    </section>
    <section class="settings-card">
      <p class="section-label">Accent</p>
      <div class="swatch-row">
        ${['steel','copper','sage'].map(c => `<button class="swatch swatch-${c} ${state.accent===c?'swatch-active':''}" data-action="set-accent" data-val="${c}"></button>`).join('')}
      </div>
    </section>
    <section class="settings-card">
      <button class="btn-secondary btn-block" data-action="export-data">${icon('download')} Export your data</button>
      <button class="btn-danger btn-block" data-action="reset-data">Reset all data</button>
    </section>
    <p class="privacy-note">${icon('lock')}<span>Your training data is stored privately to you.</span></p>
  </div>`;
}

/* ============================================================
   DATA EXPORT / RESET
   ============================================================ */
async function exportData(){
  const blob = new Blob([JSON.stringify(serializable(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fitsphere-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function resetData(){
  if(!confirm('This deletes your program, logs and skill progress for good. Continue?')) return;
  try { const db = await getCapability('db'); if(db) await db.doc('app/state').delete(); } catch(e){}
  try { if(typeof window !== 'undefined' && window.storage) await window.storage.delete(STORAGE_KEY, false); } catch(e){}
  clearInterval(timerHandle);
  state = DEFAULT_STATE();
  render();
}

/* ============================================================
   REST TIMER
   ============================================================ */
function playBeep(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.16;
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.stop(ctx.currentTime + 0.4);
  } catch(e){ /* audio not available — silent fail is fine */ }
}
function updateTimerDOM(){
  const txt = document.getElementById('timerText');
  const arc = document.getElementById('timerArc');
  if(txt) txt.textContent = Math.max(0, state.timer.remaining);
  if(arc){
    const circumference = 2 * Math.PI * 16;
    const pct = Math.max(0, state.timer.remaining / state.timer.total);
    arc.style.strokeDashoffset = String(circumference * (1 - pct));
  }
}
function startRest(seconds, label){
  clearInterval(timerHandle);
  state.timer = {running:true, remaining:seconds, total:seconds, label};
  render();
  timerHandle = setInterval(() => {
    state.timer.remaining -= 1;
    updateTimerDOM();
    if(state.timer.remaining <= 0){
      clearInterval(timerHandle);
      state.timer.running = false;
      playBeep();
      render();
    }
  }, 1000);
}

/* ============================================================
   ACTION DISPATCH
   ============================================================ */
function coerceVal(v){
  if(v === 'true') return true;
  if(v === 'false') return false;
  if(v !== '' && v != null && /^-?\d+(\.\d+)?$/.test(v)) return Number(v);
  return v;
}
function toggleMulti(key, val){
  const arr = state.wizard.answers[key] || [];
  const i = arr.indexOf(val);
  if(i >= 0) arr.splice(i,1); else arr.push(val);
  state.wizard.answers[key] = arr;
}
function wizardNext(){
  const steps = wizardSteps(state.wizard.answers);
  if(state.wizard.step < steps.length - 1) state.wizard.step++;
}
function wizardBack(){
  if(state.wizard.step > 0) state.wizard.step--;
}
function generateFromWizard(){
  const a = state.wizard.answers;
  const editing = !!state.editing;
  const profile = {
    location: a.location, gymStyle: a.gymStyle, gymMachines: a.gymMachines,
    equipment: a.equipment || [], goal: a.goal, experience: a.experience,
    days: a.days, duration: a.duration, skillGoals: a.skillGoals || [],
    limitations: a.limitations || [],
  };
  state.profile = profile;
  if(!editing) state.skillProgress = {};
  state.program = generateProgram({...profile, skillProgress: state.skillProgress});
  state.activeDayIndex = 0;
  state.units = a.units || state.units || 'kg';
  state.onboarded = true;
  state.editing = false;
  state.view = 'home';
  state.wizard = {step:0, answers:{skillGoals:[], equipment:[], limitations:[]}};
  persist();
}
function startEditProgram(){
  const p = state.profile;
  state.wizard = {step:0, answers:{...p, units: state.units}};
  state.editing = true;
  state.onboarded = false;
}
function toggleSetDone(idxStr, setStr){
  const idx = Number(idxStr), si = Number(setStr);
  const entry = state.draft.entries[idx];
  entry.sets[si].done = !entry.sets[si].done;
}
function advanceSkill(skillId){
  const max = SKILLS[skillId].steps.length - 1;
  state.skillProgress[skillId] = Math.min(max, (state.skillProgress[skillId] || 0) + 1);
  persist();
  if(state.draft){
    const entry = state.draft.entries.find(e => e.kind === 'skill' && e.skillId === skillId);
    if(entry){
      const newIdx = state.skillProgress[skillId];
      const step = SKILLS[skillId].steps[newIdx];
      entry.stepIndex = newIdx; entry.name = step.name; entry.target = step.target;
      entry.unit = step.unit; entry.metric = step.metric; entry.readyToAdvance = false;
      entry.sets = entry.sets.map(() => ({value: step.target, done:false}));
    }
  }
}

function onClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const val = t.dataset.val;
  switch(action){
    case 'nav': state.view = val; state.draft = (state.view === 'session') ? state.draft : state.draft; render(); break;
    case 'wiz-select': state.wizard.answers[t.dataset.key] = coerceVal(val); render(); break;
    case 'wiz-toggle': toggleMulti(t.dataset.key, coerceVal(val)); render(); break;
    case 'wiz-next': wizardNext(); render(); break;
    case 'wiz-back': wizardBack(); render(); break;
    case 'wiz-generate': generateFromWizard(); render(); break;
    case 'start-session': startSession(); render(); break;
    case 'exit-session':
      if(confirm('Leave this session? Logged sets will be lost.')){ clearInterval(timerHandle); state.timer.running=false; state.draft = null; state.view = 'home'; render(); }
      break;
    case 'finish-session': clearInterval(timerHandle); state.timer.running=false; finishSession(); render(); break;
    case 'toggle-set': toggleSetDone(t.dataset.idx, t.dataset.set); persist(); render(); break;
    case 'start-rest': { const idx = Number(val); const entry = state.draft.entries[idx]; startRest(entry.rest || 60, entry.name); break; }
    case 'skip-rest': clearInterval(timerHandle); state.timer.running = false; render(); break;
    case 'advance-skill': advanceSkill(val); render(); break;
    case 'edit-program': startEditProgram(); render(); break;
    case 'set-units': state.units = val; persist(); render(); break;
    case 'set-accent': state.accent = val; persist(); render(); break;
    case 'export-data': exportData(); break;
    case 'reset-data': resetData(); break;
    default: break;
  }
}
function onInput(e){
  const t = e.target;
  if(t && t.dataset && t.dataset.actionField === 'set' && state.draft){
    const idx = Number(t.dataset.idx), si = Number(t.dataset.set), field = t.dataset.field;
    const entry = state.draft.entries[idx];
    if(entry) entry.sets[si][field] = t.value === '' ? null : Number(t.value);
  }
}
function onBlurCapture(e){
  const t = e.target;
  if(t && t.dataset && t.dataset.actionField === 'set') persist();
}

/* ============================================================
   RENDER LOOP & BOOTSTRAP
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!app) return;
  document.body.dataset.accent = state.accent;
  if(!state.onboarded){ app.innerHTML = renderOnboarding(); return; }
  app.innerHTML = renderShell();
  if(state.view === 'progress') requestAnimationFrame(mountCharts);
}

async function init(){
  const saved = await restore();
  if(saved){
    state = {...DEFAULT_STATE(), ...saved, timer:{running:false, remaining:0, total:0, label:''}};
    if(state.view === 'session' && !state.draft) state.view = 'home';
  }
  const app = document.getElementById('app');
  app.addEventListener('click', onClick);
  app.addEventListener('input', onInput);
  app.addEventListener('blur', onBlurCapture, true);
  render();
}
if(typeof document !== 'undefined'){
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

</script>
